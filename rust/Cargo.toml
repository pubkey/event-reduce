[package]
name = "event-reduce"
version = "7.4.1"
edition = "2021"
rust-version = "1.70"
description = "Update live query results from database change events without re-running the query."
license = "MIT"
repository = "https://github.com/pubkey/event-reduce"
homepage = "https://github.com/pubkey/event-reduce"
readme = "README.md"
# the tests read the shared test suite of the repository, see ../test-suite
exclude = ["tests"]
keywords = ["live-query", "reactive", "realtime", "database", "bdd"]
categories = ["database", "algorithms", "data-structures"]

[dependencies]

[dev-dependencies]
serde_json = "1.0.154"
