# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master]
  pull_request:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      TAG: "${{github.sha}}"
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - uses: actions/checkout@v7
      - name: Set node version
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: javascript implementation install & build
        working-directory: ./javascript
        run: |
          npm install
          npm run build

      - name: javascript tests
        uses: GabrielBB/xvfb-action@v1.7
        with:
          working-directory: ./javascript
          run: npm run test

      - name: build examples
        working-directory: ./examples/browser
        run: |
          npm install
          npm run lint
          npm run build

      - name: test examples
        uses: GabrielBB/xvfb-action@v1.7
        with:
          working-directory: ./examples/browser
          run: npm run test

      - name: lint
        working-directory: ./javascript
        run: npm run lint

  rust:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@v7
      - name: rust format
        run: cargo fmt --check
      - name: rust clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: rust tests
        run: cargo test

  dart:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./dart
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: dart install
        run: dart pub get
      - name: dart format
        run: dart format --set-exit-if-changed .
      - name: dart analyze
        run: dart analyze --fatal-infos
      - name: dart tests
        run: dart test
      - name: dart example
        run: dart run example/example.dart

  kotlin:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./kotlin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: kotlin tests
        run: ./gradlew test

  swift:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    container:
      image: swift:6.1
    steps:
      - uses: actions/checkout@v7
      # the Package.swift is at the root of the repository
      - name: swift format
        run: swift format lint -r -s --configuration swift/.swift-format Package.swift swift/Sources swift/Tests
      - name: swift tests
        run: swift test

  csharp:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./csharp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: csharp format
        run: dotnet format --verify-no-changes
      - name: csharp tests
        run: dotnet test

  python:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: python install
        run: pip install pytest ruff mypy
      - name: python lint
        run: |
          ruff check .
          ruff format --check .
          mypy src
      - name: python tests
        run: pytest

  go:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
      - name: go format
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go tests
        run: go test ./...
