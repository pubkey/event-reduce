# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master]
  pull_request:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      TAG: "${{github.sha}}"
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - uses: actions/checkout@v7
      - name: Set node version
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: javascript implementation install & build
        working-directory: ./javascript
        run: |
          npm install
          npm run build

      - name: javascript tests
        uses: GabrielBB/xvfb-action@v1.7
        with:
          working-directory: ./javascript
          run: npm run test

      - name: build examples
        working-directory: ./examples/browser
        run: |
          npm install
          npm run lint
          npm run build

      - name: test examples
        uses: GabrielBB/xvfb-action@v1.7
        with:
          working-directory: ./examples/browser
          run: npm run test

      - name: lint
        working-directory: ./javascript
        run: npm run lint

      - name: upload example page build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: example-page
          path: ./examples/browser/dist

  # Publishes the build output of the example page to the github-pages branch
  deploy-pages:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: deploy-pages
      cancel-in-progress: true
    steps:
      - name: download example page build
        uses: actions/download-artifact@v4
        with:
          name: example-page
          path: ./dist

      - name: push to github-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: github-pages
          publish_dir: ./dist
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy example page'
